# Local stand-in for the AWS ALB: round-robins across two app replicas and
# fails over when one stops answering. This is what the replica-loss chaos
# experiment (chaos/replica-loss.json) relies on.

# Docker's embedded DNS; re-resolve so a restarted replica is picked up again.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream incident_pulse {
    zone incident_pulse 64k;
    server app-1:8000 max_fails=1 fail_timeout=5s resolve;
    server app-2:8000 max_fails=1 fail_timeout=5s resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://incident_pulse;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        # Retry on the other replica if this one is unreachable. nginx never
        # retries a POST or PATCH that already reached an app.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
