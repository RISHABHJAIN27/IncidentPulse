# Prometheus for the local Incident Pulse stack (docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Both app replicas, scraped directly (not through the load balancer) so a
  # dead replica shows up as up == 0 instead of being hidden by failover.
  - job_name: incident-pulse
    metrics_path: /metrics
    static_configs:
      - targets: ["app-1:8000", "app-2:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
