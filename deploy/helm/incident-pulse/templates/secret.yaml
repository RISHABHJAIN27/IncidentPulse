{{- if .Values.localCredentials.enabled }}
# Dummy credentials for DynamoDB Local. Real AWS access comes from IRSA, never from here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-pulse.fullname" . }}-local-credentials
  labels:
    {{- include "incident-pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DYNAMODB_LOCAL_KEY: {{ .Values.localCredentials.accessKeyId | quote }}
  DYNAMODB_LOCAL_SECRET: {{ .Values.localCredentials.secretAccessKey | quote }}
{{- end }}
