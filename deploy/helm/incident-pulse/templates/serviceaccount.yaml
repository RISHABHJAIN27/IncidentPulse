{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "incident-pulse.serviceAccountName" . }}
  labels:
    {{- include "incident-pulse.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never calls the Kubernetes API, so do not mount a token it does not need.
automountServiceAccountToken: false
{{- end }}
