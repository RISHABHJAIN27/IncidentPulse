apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "incident-pulse.fullname" . }}
  labels:
    {{- include "incident-pulse.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ ternary "local" .Values.app.environment .Values.dynamodbLocal.enabled | quote }}
  AWS_REGION: {{ .Values.app.awsRegion | quote }}
  TABLE_NAME: {{ .Values.app.tableName | quote }}
  {{- with (include "incident-pulse.dynamodbEndpoint" .) }}
  DYNAMODB_ENDPOINT: {{ . | quote }}
  {{- end }}
  OTEL_ENABLED: {{ .Values.app.otel.enabled | quote }}
  OTEL_SERVICE_NAME: "incident-pulse"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.app.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
