# Reliability gate for every pull request: unit tests, SLO rule tests, and a
# k6 smoke test that fails the build if the change would break the SLOs.
# (deploy.yml still deploys main to AWS; this workflow does not touch AWS.)
name: Reliability checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: App tests
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - name: Triage agent tests
        working-directory: triage
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  config-checks:
    name: SLO rules and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test the SLO alerting rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.1 check rules /p/rules/slo.yml
          docker run --rm -v "$PWD/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.1 test rules /p/tests/slo.test.yml
      - name: Check the Alertmanager config
        run: docker run --rm -v "$PWD/observability/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.34.2 check-config /a/alertmanager.yml
      - name: Check the compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f observability/langfuse/docker-compose.langfuse.yml config --quiet

  slo-gate:
    name: Load test against the SLOs
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start the app tier (2 replicas behind the load balancer)
        run: docker compose up -d --build --wait --wait-timeout 180 dynamodb-local app-1 app-2 lb
      - name: k6 smoke test with SLO thresholds
        run: docker compose run --rm k6 run /scripts/smoke.js
      - name: App logs
        if: failure()
        run: docker compose logs --tail 200 app-1 app-2 lb
      - name: Tear down
        if: always()
        run: docker compose down -v
